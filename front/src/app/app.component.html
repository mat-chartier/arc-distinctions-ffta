<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<header class="app-topbar">
  <a class="brand" routerLink="/">
    <img class="brand-logo" src="images/logo-club.png" alt="1ère Compagnie d'Arc du Dauphiné — Grenoble" />
    <span class="brand-name">Distinctions&nbsp;<b>FFTA</b></span>
  </a>
  <p-menubar [model]="items" styleClass="app-nav" *ngIf="isAuthenticated()">
    <ng-template #item let-item>
      <ng-container>
        <a [routerLink]="item.routerLink" class="p-menubar-item-link">
          <span [class]="item.icon"></span>
          <span class="ml-2">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-template>
  </p-menubar>
  <button class="app-logout" (click)="logout()" *ngIf="isAuthenticated()">Déconnexion</button>
  <a class="app-login" routerLink="/login" *ngIf="!isAuthenticated()">Connexion</a>
</header>

<main class="app-main">
  <router-outlet />
</main>
