<div class="col-md-6 offset-md-3 mt-5">
    <div class="card">
        <h4 class="card-header py-3">Connexion</h4>
        <div class="card-body">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" formControlName="licence" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['licence'].errors }" />
                    <div *ngIf="submitted && f['licence'].errors" class="invalid-feedback">
                        <div *ngIf="f['licence'].errors['required']">Veuillez saisir votre email</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
                    <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                        <div *ngIf="f['password'].errors['required']">Veuillez saisir votre mot de passe</div>
                    </div>
                </div>
                <button [disabled]="loading" class="btn btn-primary">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                    Se connecter
                </button>
                <button type="button" class="btn btn-link px-0 ms-3" [disabled]="resetLoading" (click)="forgotPassword()">
                    <span *ngIf="resetLoading" class="spinner-border spinner-border-sm mr-1"></span>
                    Mot de passe oublié ?
                </button>
                <div *ngIf="resetMessage" class="alert alert-success mt-3 mb-0">{{resetMessage}}</div>
                <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
            </form>
        </div>
    </div>
</div>
